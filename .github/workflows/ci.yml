name: Cargo Build & Test
permissions:
    contents: read

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

env:
    CARGO_HACK_ARGUMENTS: >-
        --verbose --rust-version --workspace --all-targets
        --ignore-private --feature-powerset --skip full,default
        --mutually-exclusive-features std,alloc
        --mutually-exclusive-features bigint,alloc
    # std will always override alloc
    # bigint automatically enables alloc

jobs:
    pre_ci:
        name: Meta Tests # run some tests like rust version control and style check
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft }}

        steps:
            - uses: actions/checkout@v6

            - uses: taiki-e/install-action@v2
              with:
                  tool: rust+clippy,rust@nightly+rustfmt,cargo-binstall,cargo-hack
            - run: rustup default stable

            - run: cargo hack check ${{ env.CARGO_HACK_ARGUMENTS }} --no-dev-deps
              # ^ fail if code cannot be compiled with rust version specified in Cargo.toml in all feature-combinations
            - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
              # ^ fail on warnings by clippy
            - run: RUSTDOCFLAGS="-D warnings --cfg docsrs" cargo +nightly doc --all-features
              # ^ fail on documentation warnings
            - run: cargo +nightly fmt --all --check
              # ^ fail when fmt was not run

    build_and_test:
        name: Rust project - latest
        runs-on: ubuntu-latest
        if: ${{ !github.event.pull_request.draft }}
        strategy:
            matrix:
                toolchain:
                    - stable
                    - beta
                    - nightly
        steps:
            - uses: actions/checkout@v6
            - uses: taiki-e/install-action@v2
              with:
                  tool: rust@${{ matrix.toolchain }},cargo-hack

            - run: cargo build --verbose
            - run:
                  cargo hack test ${{ env.CARGO_HACK_ARGUMENTS }}
